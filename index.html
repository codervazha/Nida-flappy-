<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Flying Head Fan</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body {
      background: #111;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden; color: #fff;
    }
    #game-container {
      position: relative; width: 100vw; max-width: 440px; height: 92vh; max-height: 740px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-radius: 12px; overflow: hidden; background: #4ec0ca;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
    .top-bar { position: absolute; top: 12px; right: 12px; z-index: 10; pointer-events: none; }
    .btn {
      pointer-events: auto; background: rgba(0,0,0,0.7); color: #fff; border: 2px solid #fff;
      padding: 6px 14px; font-size: 13px; font-weight: bold; border-radius: 20px; cursor: pointer;
    }
    .btn:active { transform: scale(0.94); background: #ff5722; }
    .notice { position: absolute; bottom: 8px; font-size: 11px; color: #888; text-align: center; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="top-bar">
    <button class="btn" id="speed-btn" onclick="toggleSpeed(event)">🐢 Speed: Slow</button>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<p class="notice">Tap screen or Spacebar to fly</p>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const speedBtn = document.getElementById('speed-btn');

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width;
  canvas.height = rect.height;
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize);
resize();

// ----------------------------------------------------
// Character Image
// ----------------------------------------------------
const playerImg = new Image();
playerImg.crossOrigin = 'anonymous';
playerImg.src = 'https://lh3.googleusercontent.com/d/1F1CW5_bidMqi7TQzVUpmJUp_rghyWUiM';
playerImg.onerror = () => {
  playerImg.src = 'https://drive.google.com/uc?export=view&id=1F1CW5_bidMqi7TQzVUpmJUp_rghyWUiM';
};

// ----------------------------------------------------
// Audio (Dropbox direct links)
// ----------------------------------------------------
const LOOP_URL = 'https://dl.dropboxusercontent.com/scl/fi/y3pjilgbptnm60r9nx7qc/nida-loop-audio.MP3?rlkey=jpp7xsdlyh5cv7of871f0dbn0&raw=1';
const FALL_URL = 'https://dl.dropboxusercontent.com/scl/fi/ho78e3llf9erubrg0oawl/nida-fall-audio.MP3?rlkey=ogo2wrancxfdpqixj3hcp5r8k&raw=1';

const loopAudio = new Audio(LOOP_URL);
loopAudio.loop = true;
loopAudio.preload = 'auto';

const fallAudio = new Audio(FALL_URL);
fallAudio.preload = 'auto';

loopAudio.addEventListener('error', () => console.warn('Loop audio failed to load', loopAudio.error));
fallAudio.addEventListener('error', () => console.warn('Fall audio failed to load', fallAudio.error));

let audioUnlocked = false;

// Mobile browsers need audio "primed" inside a user tap
function unlockAudioEngine() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  [loopAudio, fallAudio].forEach(a => {
    a.muted = true;
    a.play().then(() => {
      a.pause();
      a.currentTime = 0;
      a.muted = false;
    }).catch(() => { a.muted = false; });
  });
}

function startLoopAudio() {
  fallAudio.pause();
  fallAudio.currentTime = 0;
  loopAudio.currentTime = 0;
  loopAudio.play().catch(() => {});
}

function stopLoopAudio() {
  loopAudio.pause();
  loopAudio.currentTime = 0;
}

function playFallAudio() {
  stopLoopAudio();
  fallAudio.currentTime = 0;
  fallAudio.play().catch(() => {});
}

// ----------------------------------------------------
// Speeds & Physics
// ----------------------------------------------------
const speeds = [
  { name: '🐢 Slow',  vx: 1.5, gap: 195, grav: 0.22, jump: -5.0 },
  { name: '🕊️ Chill', vx: 2.1, gap: 175, grav: 0.28, jump: -6.0 },
  { name: '⚡ Fast',  vx: 3.0, gap: 155, grav: 0.35, jump: -7.0 }
];
let speedIndex = 0;

function toggleSpeed(e) {
  if (e) e.stopPropagation();
  speedIndex = (speedIndex + 1) % speeds.length;
  const n = speeds[speedIndex].name;
  const emoji = n.split(' ')[0];
  const label = n.split(' ').slice(1).join(' ');
  speedBtn.innerText = `${emoji} Speed: ${label}`;
}

// ----------------------------------------------------
// Game State & Character Setup
// ----------------------------------------------------
let state = 'START';
let score = 0;
let highScore = 0;
let fanAngle = 0;

const bird = { x: 90, y: 200, vy: 0, size: 110, hitRadius: 26 };

let pipes = [];
let spawnCounter = 0;
let groundX = 0;

function resetGame() {
  stopLoopAudio();
  fallAudio.pause();
  fallAudio.currentTime = 0;
  bird.y = canvas.height * 0.45;
  bird.vy = 0;
  pipes = [];
  spawnCounter = 0;
  score = 0;
  state = 'START';
}

function endGame() {
  if (state === 'GAMEOVER') return;
  state = 'GAMEOVER';
  if (score > highScore) highScore = score;
  playFallAudio();
}

function flap() {
  unlockAudioEngine();

  if (state === 'START') {
    state = 'PLAY';
    bird.vy = speeds[speedIndex].jump;
    startLoopAudio();
  } else if (state === 'PLAY') {
    bird.vy = speeds[speedIndex].jump;
    if (loopAudio.paused) loopAudio.play().catch(() => {});
  } else if (state === 'GAMEOVER') {
    resetGame();
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('pointerdown', () => flap());

// ----------------------------------------------------
// Pillar Spawning & Background
// ----------------------------------------------------
function spawnPipe() {
  const cfg = speeds[speedIndex];
  const groundHeight = 70;
  const playableH = canvas.height - groundHeight;
  const minTop = 60;
  const maxTop = playableH - cfg.gap - 60;
  const topH = Math.floor(minTop + Math.random() * (maxTop - minTop));

  pipes.push({
    x: canvas.width + 10,
    top: topH,
    bottom: playableH - (topH + cfg.gap),
    width: 64,
    passed: false
  });
}

function drawBackground() {
  ctx.fillStyle = '#4ec0ca';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e8f7f8';
  ctx.beginPath();
  const baseCloudY = canvas.height - 130;
  for (let x = -20; x < canvas.width + 60; x += 60) {
    ctx.moveTo(x + 40, baseCloudY);
    ctx.arc(x, baseCloudY, 40, 0, Math.PI * 2);
  }
  ctx.fill();

  ctx.fillStyle = '#83d3b7';
  const skylineY = canvas.height - 110;
  ctx.fillRect(0, skylineY, canvas.width, 50);
  for (let i = 10; i < canvas.width; i += 45) {
    ctx.fillRect(i, skylineY - 24, 28, 24);
    ctx.fillStyle = '#a6e5cb';
    ctx.fillRect(i + 4, skylineY - 18, 5, 8);
    ctx.fillRect(i + 16, skylineY - 18, 5, 8);
    ctx.fillStyle = '#83d3b7';
  }
}

function drawGround() {
  const groundH = 70;
  const y = canvas.height - groundH;

  ctx.fillStyle = '#5ee126';
  ctx.fillRect(0, y, canvas.width, 14);
  ctx.fillStyle = '#2d8900';
  ctx.fillRect(0, y + 12, canvas.width, 3);

  ctx.fillStyle = '#ddd894';
  ctx.fillRect(0, y + 15, canvas.width, groundH - 15);

  ctx.strokeStyle = '#c8bc75';
  ctx.lineWidth = 3;
  for (let x = (groundX % 20) - 20; x < canvas.width + 20; x += 18) {
    ctx.beginPath();
    ctx.moveTo(x, y + 16);
    ctx.lineTo(x - 8, canvas.height);
    ctx.stroke();
  }
}

function drawPipe(p) {
  const pipeWidth = p.width;
  const capHeight = 24;
  const lip = 4;

  ctx.fillStyle = '#73be2e';
  ctx.strokeStyle = '#2d571b';
  ctx.lineWidth = 3;

  // Top pipe
  ctx.fillRect(p.x, 0, pipeWidth, p.top);
  ctx.strokeRect(p.x, -2, pipeWidth, p.top + 2);
  ctx.fillRect(p.x - lip, p.top - capHeight, pipeWidth + lip * 2, capHeight);
  ctx.strokeRect(p.x - lip, p.top - capHeight, pipeWidth + lip * 2, capHeight);

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(p.x + 6, 0, 7, p.top - capHeight);
  ctx.fillRect(p.x - lip + 6, p.top - capHeight, 7, capHeight);

  // Bottom pipe
  const botY = canvas.height - 70 - p.bottom;
  ctx.fillStyle = '#73be2e';
  ctx.fillRect(p.x, botY, pipeWidth, p.bottom);
  ctx.strokeRect(p.x, botY, pipeWidth, p.bottom + 2);
  ctx.fillRect(p.x - lip, botY, pipeWidth + lip * 2, capHeight);
  ctx.strokeRect(p.x - lip, botY, pipeWidth + lip * 2, capHeight);

  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(p.x + 6, botY + capHeight, 7, p.bottom - capHeight);
  ctx.fillRect(p.x - lip + 6, botY, 7, capHeight);
}

// ----------------------------------------------------
// Large HD Character + Spinning Head Fan
// ----------------------------------------------------
function drawCharacterWithHeadFan() {
  ctx.save();
  ctx.translate(bird.x, bird.y);

  const angle = Math.max(-0.40, Math.min(0.55, bird.vy * 0.07));
  ctx.rotate(angle);

  const sz = bird.size;

  if (playerImg.complete && playerImg.naturalWidth > 0) {
    ctx.drawImage(playerImg, -sz / 2, -sz / 2, sz, sz);
  }

  // Head fan mount
  const headX = -5;
  const headY = -sz / 2 + 18;

  ctx.fillStyle = '#222';
  ctx.fillRect(headX - 3, headY - 14, 6, 14);

  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.arc(headX, headY, 9, Math.PI, 0);
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Spinning blades
  ctx.save();
  ctx.translate(headX, headY - 14);
  ctx.scale(1, 0.40);
  ctx.rotate(fanAngle);

  ctx.fillStyle = 'rgba(255, 235, 59, 0.32)';
  ctx.beginPath();
  ctx.arc(0, 0, 32, 0, Math.PI * 2);
  ctx.fill();

  const bladeColors = ['#ffeb3b', '#00e5ff', '#ff1744'];
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.rotate((i * 2 * Math.PI) / 3);
    ctx.fillStyle = bladeColors[i];
    ctx.beginPath();
    ctx.ellipse(18, 0, 19, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.8;
    ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle = '#212121';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
  ctx.restore();
}

function checkCollision(p) {
  const bx = bird.x;
  const by = bird.y;
  const r = bird.hitRadius;

  const pLeft = p.x - 4;
  const pRight = p.x + p.width + 4;
  const topPipeBottom = p.top;
  const botPipeTop = canvas.height - 70 - p.bottom;

  if (bx + r > pLeft && bx - r < pRight) {
    if (by - r < topPipeBottom || by + r > botPipeTop) return true;
  }
  return false;
}

// ----------------------------------------------------
// Main Loop
// ----------------------------------------------------
function loop() {
  const cfg = speeds[speedIndex];
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const spinSpeed = state === 'PLAY' ? 0.38 + Math.max(0, -bird.vy * 0.05) : 0.16;
  fanAngle += spinSpeed;

  drawBackground();

  if (state === 'START') {
    bird.y = canvas.height * 0.45 + Math.sin(Date.now() * 0.005) * 8;
    drawCharacterWithHeadFan();
    drawGround();

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.font = 'bold 24px Courier New, sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('TAP TO FLY!', canvas.width / 2, canvas.height * 0.32);
    ctx.fillText('TAP TO FLY!', canvas.width / 2, canvas.height * 0.32);

    ctx.font = 'bold 15px sans-serif';
    ctx.strokeText('Infinite Score | Slow & Easy', canvas.width / 2, canvas.height * 0.37);
    ctx.fillText('Infinite Score | Slow & Easy', canvas.width / 2, canvas.height * 0.37);

  } else if (state === 'PLAY') {
    groundX -= cfg.vx;
    bird.vy += cfg.grav;
    bird.y += bird.vy;

    spawnCounter += cfg.vx;
    if (spawnCounter > 205) {
      spawnPipe();
      spawnCounter = 0;
    }

    for (let i = pipes.length - 1; i >= 0; i--) {
      const p = pipes[i];
      p.x -= cfg.vx;
      drawPipe(p);

      if (!p.passed && bird.x > p.x + p.width / 2) {
        p.passed = true;
        score++;
      }

      if (checkCollision(p)) endGame();

      if (p.x + p.width < -20) pipes.splice(i, 1);
    }

    const groundLimit = canvas.height - 70 - bird.hitRadius;
    if (bird.y >= groundLimit) {
      bird.y = groundLimit;
      endGame();
    }

    if (bird.y - bird.hitRadius <= 0) {
      bird.y = bird.hitRadius;
      bird.vy = 0;
    }

    drawCharacterWithHeadFan();
    drawGround();

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 5;
    ctx.font = 'bold 44px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText(score, canvas.width / 2, 75);
    ctx.fillText(score, canvas.width / 2, 75);

  } else if (state === 'GAMEOVER') {
    for (const p of pipes) drawPipe(p);
    drawCharacterWithHeadFan();
    drawGround();

    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 5;
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.strokeText('GAME OVER', canvas.width / 2, canvas.height * 0.40);
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height * 0.40);

    ctx.font = 'bold 20px sans-serif';
    ctx.strokeText(`SCORE: ${score}`, canvas.width / 2, canvas.height * 0.47);
    ctx.fillText(`SCORE: ${score}`, canvas.width / 2, canvas.height * 0.47);

    ctx.fillStyle = '#ffd54f';
    ctx.strokeText(`BEST: ${highScore}`, canvas.width / 2, canvas.height * 0.53);
    ctx.fillText(`BEST: ${highScore}`, canvas.width / 2, canvas.height * 0.53);

    ctx.fillStyle = '#fff';
    ctx.font = '16px Courier New, monospace';
    ctx.fillText('Tap or Space to Restart', canvas.width / 2, canvas.height * 0.62);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
